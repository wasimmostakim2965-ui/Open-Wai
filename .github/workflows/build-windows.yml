name: Build Windows installer

# Produces ONE directly runnable, graphical Windows installer for THIS fork.
#
#   OpenClaw-windows-x64-setup.exe
#
# The desktop shell is the Tauri v2 app under `apps/linux/src-tauri`. Its
# `frontendDist` is the committed `apps/linux/ui` frontend, so `tauri build`
# needs no separate frontend step. `--bundles nsis` emits a single
# self-contained NSIS installer `.exe` (no MSI, no zip of folders).
#
# Running the installer places a normal Windows app; opening it shows a native
# window that loads the agent's Control UI (the graphical chat/dashboard). There
# is no terminal. The shell installs and supervises this fork's CLI/Gateway at
# run time via the bundled installer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "scripts/install.ps1"
      - "scripts/install-cli.sh"
      - "scripts/build-windows-runtime.mjs"
      - "apps/linux/src-tauri/**"
      - "apps/linux/ui/**"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The agent build is by far the slowest step (~35-40 min on windows-latest), and
  # it does not change while iterating on the desktop shell or the runtime
  # builder. Build the tarball once here and hand it to `build` as an artifact, so
  # re-running `build` alone is a few minutes instead of a full rebuild.
  package:
    name: Build the agent package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\pnpm\store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache build outputs (incremental)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `build-all` is content-signature based: it compares each step's inputs
          # against .artifacts/build-all-cache/*/stamp.json and only recompiles the
          # steps whose sources actually changed. Persisting this directory turns a
          # ~35 min cold build into a few minutes for a one-file edit.
          path: .artifacts/build-all-cache
          key: build-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-all-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-all-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline \
            --config.ignore-scripts=false --config.engine-strict=false \
            --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Build the agent package (this fork)
        shell: bash
        env:
          OPENCLAW_PREPACK_ALLOW_UNRELEASED_CHANGELOG: "1"
        run: |
          set -euo pipefail
          # Build the fork's own agent package. `npm pack` on the pnpm workspace
          # root is unsafe: it rewrites `workspace:*` ranges to an exact version
          # WITHOUT bundling the in-repo `@openclaw/ai` package, so the runtime
          # resolves `@openclaw/ai` from the public npm registry. That registry
          # build does not export `getDefaultAiTransportHost`, which the fork's
          # own dist code imports, so every extension crashes with an ESM
          # SyntaxError ("does not provide an export named ...") and the Gateway
          # never boots (readiness budget exhausted / port 18789 free).
          # The canonical packer bundles `@openclaw/ai` into the tarball so the
          # runtime is fully self-contained.
          pnpm build
          node scripts/package-openclaw-for-docker.mjs \
            --skip-build --allow-unreleased-changelog \
            --output-dir . \
            --output-name "openclaw-$(node -p "require('./package.json').version").tgz"
          ls -la openclaw-*.tgz
          node scripts/check-openclaw-package-tarball.mjs --require-bundled-workspace-deps \
            "openclaw-$(node -p "require('./package.json').version").tgz"

      - name: Upload the agent package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openclaw-agent-package
          path: openclaw-*.tgz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows installer (.exe)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/src-tauri/target
          key: windows-app-build-${{ runner.os }}-${{ hashFiles('apps/linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-app-build-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          # `Build Windows installer` runs `pnpm dlx @tauri-apps/cli`, but this job
          # does not run `pnpm install`, so nothing else provides pnpm. Activate
          # the pinned packageManager (pnpm@12.5.1) via corepack.
          corepack enable
          pnpm --version

      - name: Download the agent package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: openclaw-agent-package

      - name: Build the self-contained Windows runtime
        shell: bash
        run: |
          set -euo pipefail
          # Portable Node.js + the agent + its production dependencies, packed so a
          # first run needs no npm, git, or network access. This single archive ships
          # as the `openclaw-runtime.zip` resource and supersedes the plain agent
          # tarball, so the installer only carries one self-contained payload.
          node scripts/build-windows-runtime.mjs \
            --package "$(ls openclaw-*.tgz)" \
            --out apps/linux/src-tauri/target/installers/openclaw-runtime.zip
          ls -la apps/linux/src-tauri/target/installers/openclaw-runtime.zip


      - name: Validate the bundled installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Parse the PowerShell installer so a syntax error can never ship, and
          # prove the new offline `-RuntimeArchive` option binds.
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/install.ps1").Path,
            [ref]$null,
            [ref]$parseErrors
          )
          if ($parseErrors) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "scripts/install.ps1 has parse errors."
          }
          $help = & scripts/install.ps1 -Help
          if (-not ($help -match "RuntimeArchive")) {
            throw "scripts/install.ps1 does not expose -RuntimeArchive."
          }
          Write-Host "install.ps1 parses and exposes -RuntimeArchive."

      - name: Stamp the release version
        shell: bash
        run: |
          set -euo pipefail
          # `is_release_version` in main.rs treats the committed 0.1.0 as a
          # development build, which routes the app into its "Choose a release
          # channel" dev flow. Stamp a release version so the app treats itself
          # as a normal GUI build and installs straight to the chat board.
          version="$(node -p "require('./package.json').version")"
          if [ -z "$version" ] || [ "$version" = "0.1.0" ]; then
            echo "unexpected package version: '$version'" >&2
            exit 1
          fi
          echo "Stamping app version $version"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const file of ["apps/linux/src-tauri/tauri.conf.json", "apps/linux/src-tauri/Cargo.toml"]) {
              let text = fs.readFileSync(file, "utf8");
              if (file.endsWith(".json")) {
                const data = JSON.parse(text);
                data.version = version;
                fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
              } else {
                text = text.replace(/^version = ".*"$/m, `version = "${version}"`);
                fs.writeFileSync(file, text);
              }
            }
          ' "$version"
          grep -m1 '"version"' apps/linux/src-tauri/tauri.conf.json

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          # A cached `target/` can hold installers from earlier builds (for
          # example an older stamped version). Clear the bundle directory so the
          # staging step below sees exactly the installer this run produced.
          rm -rf apps/linux/src-tauri/target/release/bundle/nsis
          # Tauri's JSON-merge override replaces arrays, so `icon` is restated in
          # full: the NSIS bundler requires an `.ico`, which the base config does
          # not list even though `icons/icon.ico` ships in the repo.
          # `createUpdaterArtifacts:false` keeps this build keyless.
          pnpm dlx @tauri-apps/cli@2.11.4 build --bundles nsis \
            --config "{\"identifier\":\"ai.openclaw.windows\",\"bundle\":{\"createUpdaterArtifacts\":false,\"resources\":{\"target/installers/install-cli.sh\":\"install-cli.sh\",\"target/installers/install.ps1\":\"install.ps1\",\"target/installers/openclaw-runtime.zip\":\"openclaw-runtime.zip\"},\"icon\":[\"icons/32x32.png\",\"icons/128x128.png\",\"icons/128x128@2x.png\",\"icons/icon.png\",\"icons/icon.ico\"]}}"

      - name: Verify and stage installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "apps/linux/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) {
            throw "No NSIS installer was produced."
          }
          # If a cached bundle left more than one, stage the one this run wrote.
          $installer = $installers | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "'$($installer.Name)' is not a Windows PE executable (missing MZ header)."
          }
          New-Item -ItemType Directory -Force -Path "dist/windows-app" | Out-Null
          $destination = "dist/windows-app/OpenClaw-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          Write-Host ("staged {0} ({1:N0} bytes)" -f $destination, $installer.Length)

          # Prove the offline runtime shipped: the resource must exist and be a zip.
          # The installer embeds it NSIS/LZMA-compressed, so the installer is NOT
          # guaranteed to be larger than the raw runtime zip (the runtime is itself
          # deflated, so recompressing it shrinks it further). Do not assert a size
          # relationship — NSIS compression makes it invalid. Assert instead that
          # the installer is a plausible self-contained payload and report both
          # sizes so a regression is visible.
          $runtime = "apps/linux/src-tauri/target/installers/openclaw-runtime.zip"
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) {
            throw "The self-contained runtime archive was not staged for bundling."
          }
          $runtimeBytes = [System.IO.File]::ReadAllBytes($runtime)
          if ($runtimeBytes.Length -lt 4 -or $runtimeBytes[0] -ne 0x50 -or $runtimeBytes[1] -ne 0x4B) {
            throw "The self-contained runtime archive is not a zip file."
          }
          if ($runtimeBytes.Length -lt 50MB) {
            throw "The self-contained runtime archive is only $($runtimeBytes.Length) bytes; the bundled dependency tree did not ship."
          }
          if ($installer.Length -lt 50MB) {
            throw "The installer ($($installer.Length) bytes) is too small to embed the runtime; the resource was not bundled."
          }
          Write-Host ("bundled offline runtime: {0:N0} bytes (installer {1:N0} bytes)" -f $runtimeBytes.Length, $installer.Length)

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenClaw-windows-x64-setup
          path: dist/windows-app/OpenClaw-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "windows-latest"
          $asset = "dist/windows-app/OpenClaw-windows-x64-setup.exe"
          # One stable download link for testers. `--clobber` replaces the asset
          # on every rebuild; the release carries no source, so it never
          # collides with upstream version/release tags.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Windows installer (latest)" `
              --notes "Automatically rebuilt from ``main``. Download **OpenClaw-windows-x64-setup.exe** and run it. This is a graphical app: opening it shows the agent UI (no terminal)."
          }
          gh release upload $tag $asset --clobber
          Write-Host "https://github.com/${{ github.repository }}/releases/download/$tag/OpenClaw-windows-x64-setup.exe"
