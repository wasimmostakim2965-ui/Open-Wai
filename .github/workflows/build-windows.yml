name: Build Windows App

# Manual workflow that produces a directly runnable Windows `.exe` installer.
#
# The desktop shell is the Tauri v2 app under `apps/linux/src-tauri`. Its
# `frontendDist` is the committed `apps/linux/ui` frontend plus the bundled
# fonts, so the installer only needs `tauri build` -- there is no separate
# frontend build step, and the app never loads `dist/` (the JS runtime /
# Control UI bundles are a Gateway concern, not this desktop shell). That is
# also why the shell stays small: it is a thin companion that installs and
# manages the OpenClaw CLI/Gateway at runtime; it does not embed a Node runtime.
#
# The Windows flavour is produced by overriding the Tauri config on the command
# line, matching the proven `build_windows` job in
# `.github/workflows/linux-app-release.yml`. `--bundles nsis` emits a single
# self-contained NSIS installer `.exe`; no MSI is produced, so the artifact
# download is the runnable `.exe` itself rather than an archive of both formats.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Build Windows installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/src-tauri/target
          key: windows-app-build-${{ runner.os }}-${{ hashFiles('apps/linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-app-build-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline \
            --config.ignore-scripts=false --config.engine-strict=false \
            --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          # Tauri's JSON-merge override replaces arrays, so `icon` is restated in
          # full: the NSIS bundler requires an `.ico`, which the base Linux config
          # does not list even though `icons/icon.ico` ships in the repo.
          # `createUpdaterArtifacts:false` keeps the build keyless; a signed
          # updater bundle is a release-only concern owned by linux-app-release.yml.
          pnpm dlx @tauri-apps/cli@2.11.4 build --bundles nsis \
            --config "{\"identifier\":\"ai.openclaw.windows\",\"bundle\":{\"createUpdaterArtifacts\":false,\"icon\":[\"icons/32x32.png\",\"icons/128x128.png\",\"icons/128x128@2x.png\",\"icons/icon.png\",\"icons/icon.ico\"]}}"

      - name: Verify and stage installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "apps/linux/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          $installer = $installers[0]
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "'$($installer.Name)' is not a Windows PE executable (missing MZ header)."
          }
          New-Item -ItemType Directory -Force -Path "dist/windows-app" | Out-Null
          $destination = "dist/windows-app/OpenClaw-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          Write-Host ("staged {0} ({1:N0} bytes)" -f $destination, $installer.Length)

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OpenClaw-windows-x64-setup
          path: dist/windows-app/OpenClaw-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
