name: Build Windows App

# Manual workflow that produces the OpenClaw desktop GUI installers for Windows.
#
# The desktop shell is the Tauri v2 app under `apps/linux/src-tauri`. That crate
# carries Windows-specific code paths (for example `gateway_windows.rs` and the
# `cfg(target_os = "windows")` branches), and the committed `apps/linux/ui`
# frontend plus the bundled fonts are the app's `frontendDist`, so no separate
# UI copy step is required for the shell itself. There is no `apps/windows`
# directory; the Windows flavour is produced by overriding the Tauri config on
# the command line (identifier + keyless bundle), matching the proven
# `build_windows` job in `.github/workflows/linux-app-release.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    name: Build Windows GUI installers
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/src-tauri/target
          key: windows-app-build-${{ runner.os }}-${{ hashFiles('apps/linux/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-app-build-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline \
            --config.ignore-scripts=false --config.engine-strict=false \
            --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Build JS runtime and Control UI bundles
        shell: bash
        run: pnpm build

      - name: Build Windows Tauri bundle
        working-directory: apps/linux/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # The GUI ships from the committed frontend, so no `beforeBuildCommand`.
          # Tauri's JSON-merge override replaces arrays, so `icon` is restated in
          # full here: the Windows bundlers (nsis/msi) require an `.ico`, which the
          # base Linux config does not list even though `icons/icon.ico` ships.
          # `createUpdaterArtifacts:false` keeps the build keyless; a signed
          # updater bundle is a release-only concern owned by linux-app-release.yml.
          pnpm dlx @tauri-apps/cli@2.11.4 build --bundles nsis,msi \
            --config "{\"identifier\":\"ai.openclaw.windows\",\"bundle\":{\"createUpdaterArtifacts\":false,\"icon\":[\"icons/32x32.png\",\"icons/128x128.png\",\"icons/128x128@2x.png\",\"icons/icon.png\",\"icons/icon.ico\"]}}"

      - name: Stage installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = @(Get-ChildItem "apps/linux/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem "apps/linux/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          if ($nsis.Count -eq 0 -and $msi.Count -eq 0) {
            throw "No Windows installers were produced."
          }
          New-Item -ItemType Directory -Force -Path "dist/windows-app" | Out-Null
          foreach ($file in @($nsis) + @($msi)) {
            Copy-Item -LiteralPath $file.FullName -Destination "dist/windows-app/$($file.Name)"
            Write-Host ("staged {0} ({1:N0} bytes)" -f $file.Name, $file.Length)
          }

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-windows-installers
          path: dist/windows-app/*
          if-no-files-found: error
          retention-days: 14
